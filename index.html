<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CivixX – Bildungseinrichtungen in Leipzig</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <style>
    html, body { margin: 0; height: 100%; }
    #map { width: 100%; height: 100vh; }
    #controls {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 8px;
      background: white;
      border-radius: 4px;
      box-shadow: 0 1px 5px rgba(0,0,0,.4);
    }
    #search { display: flex; gap: 6px; }
    #search input { width: 220px; padding: 6px; border: 1px solid #ccc; border-radius: 4px; }
    #search button, #location-button { padding: 6px 10px; border: 1px solid #ccc; border-radius: 4px; background: #f5f5f5; cursor: pointer; }
    #search button:hover, #location-button:hover { background: #e5e5e5; }
    #message { display: none; padding: 6px; border-radius: 4px; background: #fde8e8; color: #b00020; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="controls">
    <form id="search">
      <input type="text" placeholder="Adresse suchen" required>
      <button type="submit">Suchen</button>
    </form>
    <button type="button" id="location-button">Mein Standort</button>
    <div id="message"></div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script>
    const maxBounds = [[51.12, 12.00], [51.56, 12.75]];
    const map = L.map('map', { maxBounds, maxBoundsViscosity: 1 }).setView([51.3397, 12.3731], 12);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      minZoom: 10,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>-Mitwirkende'
    }).addTo(map);

    let marker = null;
    const message = document.getElementById('message');
    const form = document.getElementById('search');
    const input = form.querySelector('input');
    const locationButton = document.getElementById('location-button');

    function showMessage(text) {
      message.textContent = text;
      message.style.display = 'block';
      setTimeout(() => { message.style.display = 'none'; }, 4000);
    }

    function setMarker(lat, lon, text) {
      if (marker) marker.remove();
      marker = L.marker([lat, lon]).addTo(map).bindPopup(text);
      return marker;
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();
      const query = input.value.trim();
      if (!query) return;

      const url = new URL('https://nominatim.openstreetmap.org/search');
      url.searchParams.set('q', query);
      url.searchParams.set('format', 'json');
      url.searchParams.set('countrycodes', 'de');
      url.searchParams.set('viewbox', `${maxBounds[0][1]},${maxBounds[0][0]},${maxBounds[1][1]},${maxBounds[1][0]}`);
      url.searchParams.set('bounded', '1');

      const response = await fetch(url);
      const results = await response.json();
      if (!results.length) {
        showMessage('Keine Adresse gefunden.');
        return;
      }

      const result = results[0];
      const lat = parseFloat(result.lat);
      const lon = parseFloat(result.lon);
      map.setView([lat, lon], 15);
      setMarker(lat, lon, result.display_name);
    });

    locationButton.addEventListener('click', () => {
      if (!navigator.geolocation) {
        showMessage('Geolokalisierung wird nicht unterstützt.');
        return;
      }
      navigator.geolocation.getCurrentPosition(position => {
        const { latitude: lat, longitude: lon } = position.coords;
        if (!map.getBounds().contains([lat, lon])) {
          showMessage('Der Standort liegt außerhalb des Kartenbereichs.');
          return;
        }
        map.setView([lat, lon], 15);
        setMarker(lat, lon, 'Mein Standort');
      }, () => {
        showMessage('Standort konnte nicht ermittelt werden.');
      });
    });

    map.on('click', event => {
      const { lat, lng } = event.latlng;
      setMarker(lat, lng, `${lat.toFixed(5)}, ${lng.toFixed(5)}`);
    });
  </script>
</body>
</html>
