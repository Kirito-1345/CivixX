<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CivixX – Bildungseinrichtungen in Leipzig</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #1f2937;
    }

    #map { width: 100%; height: 100vh; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    #controls {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 1000;
      width: min(340px, calc(100vw - 24px));
      padding: 10px;
      background: rgba(255, 255, 255, .92);
      border: 1px solid rgba(15, 23, 42, .12);
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, .14);
      box-sizing: border-box;
    }

    #search { display: flex; gap: 6px; }

    #search input {
      flex: 1;
      min-width: 0;
      padding: 8px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
    }

    button {
      padding: 8px 10px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      background: #f3f4f6;
      color: #1f2937;
      font: inherit;
      cursor: pointer;
    }

    button:hover:not(:disabled) { background: #e5e7eb; }
    button:disabled { cursor: not-allowed; opacity: .65; }

    #location-button { width: 100%; margin-top: 6px; }

    #message {
      display: none;
      margin-top: 8px;
      padding: 8px;
      border-radius: 6px;
      background: #fee2e2;
      color: #991b1b;
    }

    #message:empty { display: none; }
  </style>
</head>
<body>
  <div id="map"></div>

  <section id="controls" aria-label="Kartensteuerung">
    <form id="search" role="search">
      <label class="sr-only" for="address">Adresse suchen</label>
      <input id="address" name="address" type="search" placeholder="Adresse in Leipzig suchen" autocomplete="street-address" required>
      <button id="search-button" type="submit">Suchen</button>
    </form>
    <button id="location-button" type="button">Mein Standort</button>
    <p id="message" role="status" aria-live="polite"></p>
  </section>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script>
    'use strict';

    const maxBounds = L.latLngBounds([51.12, 12.00], [51.56, 12.75]);
    const map = L.map('map', {
      maxBounds,
      maxBoundsViscosity: 0.8,
      zoomControl: true
    }).setView([51.3397, 12.3731], 12);

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      minZoom: 10,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>-Mitwirkende'
    }).addTo(map);

    const message = document.getElementById('message');
    const form = document.getElementById('search');
    const addressInput = document.getElementById('address');
    const searchButton = document.getElementById('search-button');
    const locationButton = document.getElementById('location-button');
    const markers = L.layerGroup().addTo(map);

    let searchAbortController = null;
    let messageTimer = null;

    function showMessage(text) {
      clearTimeout(messageTimer);
      message.textContent = text;
      message.style.display = 'block';
      messageTimer = setTimeout(() => {
        message.style.display = 'none';
        message.textContent = '';
      }, 5000);
    }

    function setMarker(lat, lon, text) {
      markers.clearLayers();
      return L.marker([lat, lon], { title: text }).addTo(markers).bindPopup(text);
    }

    async function geocode(query) {
      const url = new URL('https://nominatim.openstreetmap.org/search');
      url.searchParams.set('q', query);
      url.searchParams.set('format', 'jsonv2');
      url.searchParams.set('limit', '1');
      url.searchParams.set('countrycodes', 'de');
      url.searchParams.set('viewbox', `${maxBounds.getWest()},${maxBounds.getNorth()},${maxBounds.getEast()},${maxBounds.getSouth()}`);
      url.searchParams.set('bounded', '1');

      const response = await fetch(url, { signal: searchAbortController.signal });
      if (!response.ok) throw new Error('network');
      const results = await response.json();
      return results.length ? results[0] : null;
    }

    async function searchAddress(query) {
      searchAbortController?.abort();
      searchAbortController = new AbortController();
      searchButton.disabled = true;

      try {
        const result = await geocode(query);
        if (!result) {
          showMessage('Keine Adresse gefunden.');
          return;
        }

        const lat = parseFloat(result.lat);
        const lon = parseFloat(result.lon);
        if (!maxBounds.contains([lat, lon])) {
          showMessage('Die Adresse liegt außerhalb des Kartenbereichs.');
          return;
        }

        map.setView([lat, lon], 15);
        setMarker(lat, lon, result.display_name);
      } catch (error) {
        if (error.name !== 'AbortError') showMessage('Suche ist fehlgeschlagen. Bitte später erneut versuchen.');
      } finally {
        searchButton.disabled = false;
      }
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();
      const query = addressInput.value.trim();
      if (query) await searchAddress(query);
    });

    locationButton.addEventListener('click', () => {
      if (!navigator.geolocation) {
        showMessage('Geolokalisierung wird nicht unterstützt.');
        return;
      }

      locationButton.disabled = true;
      navigator.geolocation.getCurrentPosition(
        position => {
          const { latitude: lat, longitude: lon } = position.coords;
          if (!maxBounds.contains([lat, lon])) {
            showMessage('Der Standort liegt außerhalb des Kartenbereichs.');
            return;
          }
          map.setView([lat, lon], 15);
          setMarker(lat, lon, 'Mein Standort');
        },
        () => showMessage('Standort konnte nicht ermittelt werden.'),
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 }
      );
      locationButton.disabled = false;
    });

    map.on('click', event => {
      const { lat, lng } = event.latlng;
      setMarker(lat, lng, `${lat.toFixed(5)}, ${lng.toFixed(5)}`);
    });
  </script>
</body>
</html>
